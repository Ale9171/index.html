<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <meta
      name="description"
      content="Habit Tracker dashboard minimalista y responsivo"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand-block">
            <div class="brand-mark">◎</div>
            <div>
              <p class="eyebrow">Productivity</p>
              <h1>My Habits</h1>
            </div>
          </div>
        </div>

        <div class="habit-summary">
          <div class="summary-block">
            <span class="label">Active</span>
            <strong id="activeHabitCount">0</strong>
          </div>
          <div class="summary-block">
            <span class="label">Goal</span>
            <strong id="totalGoal">0</strong>
          </div>
        </div>

        <div class="habit-list" id="habitList" aria-label="Lista de hábitos"></div>

        <div class="sidebar-footer">
          <button class="ghost-button" type="button" id="addHabitBtn">
            ＋ Add Habit
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Monthly overview</p>
            <h2>Habit Tracker</h2>
          </div>

          <div class="topbar-actions">
            <button class="primary-button" type="button" id="manageHabitsBtn">
              ⚙️ Manage Habits
            </button>
          </div>
        </header>

        <section class="stats-grid">
          <article class="stat-card accent">
            <div class="stat-header">
              <span>Daily Progress</span>
              <span class="pill success">+12.5%</span>
            </div>
            <div class="stat-body">
              <strong id="dailyProgressValue">0%</strong>
              <small>Average completion</small>
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-header">
              <span>Overall Stats</span>
              <span class="pill neutral">This month</span>
            </div>
            <div class="ring-wrap">
              <div class="ring" data-progress="0">
                <div class="ring-inner">
                  <strong id="overallPercent">0%</strong>
                </div>
              </div>
            </div>
          </article>
        </section>

        <section class="content-grid">
          <div class="calendar-panel">
            <div class="section-header">
              <div>
                <p class="eyebrow">Calendar</p>
                <h3>31-Day Matrix</h3>
              </div>
            </div>

            <div class="calendar-wrapper">
              <div class="calendar-grid" id="calendarGrid" aria-live="polite"></div>
            </div>
          </div>

          <div class="insights-panel">
            <div class="section-header">
              <div>
                <p class="eyebrow">Overview</p>
                <h3>Daily Performance</h3>
              </div>
            </div>

            <div class="bar-chart" id="dailyBarChart"></div>
          </div>
        </section>

        <section class="analysis-panel">
          <div class="section-header">
            <div>
              <p class="eyebrow">Analysis</p>
              <h3>Habit Performance</h3>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Habit</th>
                  <th>Goal</th>
                  <th>Actual</th>
                  <th>Left</th>
                  <th>Progress</th>
                  <th>%</th>
                </tr>
              </thead>
              <tbody id="analysisTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
