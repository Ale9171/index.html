<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Simulación del contenedor con el efecto visual del video */
        .heart_love {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px;
            overflow: hidden;
            color: #ff69b4;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #ff1493;
        }

        /* Estilo general para darle un toque romántico y visual */
        htitle {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: block;
            letter-gap: 2px;
        }

        .message-box {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid #ff1493;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
            max-width: 400px;
            margin: auto;
        }

        p {
            color: #f1f1f1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .signature {
            color: #ff69b4;
            font-weight: bold;
        }
    </5style>
</head>
<body>

    <div class="container">
        <div class="message-box">
            <div class="heart_love">
                ❤️ TE AMO ❤️
            </div>
            <p>
                Mi amor, sé que a veces fallo y que he cometido errores que te han lastimado. Me duele en el alma saber que con mis acciones no he estado a la altura de la gran mujer que eres y de lo que nuestra familia merece. 
                <br><br>
                Sé que tengo mucho que mejorar y me duele haberte fallado, pero quiero que sepas que eres el amor de mi vida. No hay un solo día en que no reconozca la bendición que 
                eres para mí. Perdóname por mis defectos; te amo con todas mis fuerzas y te amaré siempre, pase lo que pase.
            </p>
            <span class="signature">Siempre tuyo.</span>
        </div>
    </div>

</body>
</html>
